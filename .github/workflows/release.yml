name: Release

# v*.*.* and not v*, so moving the v1 tag never starts another release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = windows ]; then
              ext=.exe
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/evidence-gate-$VERSION-$os-$arch$ext" ./cmd/evidence-gate
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --generate-notes

      # users write vildande/evidence-gate@v1 and get the latest v1.x.y
      - name: Move major tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major=${VERSION%%.*}
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
