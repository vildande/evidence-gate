name: evidence-gate
description: Check CI evidence against JSON Schemas and Rego policies, fail the job if the gate fails

inputs:
  evidence:
    description: Directory with test-report.json and optional waivers.json
    required: true
  policies:
    description: Directory with .rego policies (default is the policies bundled with the action)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build evidence-gate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/evidence-gate" ./cmd/evidence-gate

    # inputs go through env, not straight into the script, so they can't inject shell code
    - name: Check evidence
      shell: bash
      env:
        EVIDENCE: ${{ inputs.evidence }}
        POLICIES: ${{ inputs.policies }}
      run: |
        args=(check --evidence "$EVIDENCE" --summary "$GITHUB_STEP_SUMMARY")
        if [ -n "$POLICIES" ]; then
          args+=(--policies "$POLICIES")
        fi
        "$RUNNER_TEMP/evidence-gate" "${args[@]}"
